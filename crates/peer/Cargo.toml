[package]
name = "syncjoy-peer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["native"]
native = ["dep:webrtc", "dep:tokio-tungstenite", "dep:futures-util", "tokio/net", "tokio/time", "tokio/rt"]
web = [
  "dep:web-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures",
  "dep:js-sys", "dep:gloo-timers", "dep:futures-util",
]

[dependencies]
syncjoy-protocol = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

futures-util = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
webrtc = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
gloo-timers = { workspace = true, optional = true }

[dev-dependencies]
syncjoy-relay = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
futures-util = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "macros"] }
tokio-tungstenite = { workspace = true }

[lints]
workspace = true
